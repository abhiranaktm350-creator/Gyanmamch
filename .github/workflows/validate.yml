name: Validate Gyan Manch
on:
  push:
    branches: [main, work/gyan-manch-light-theme]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest is valid JSON')"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid JSON')"
      - name: Check inline JavaScript in index.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None
                  self.external = False
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.current = []
                      self.external = any(k.lower() == 'src' for k, _ in attrs)
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      if not self.external:
                          self.scripts.append(''.join(self.current))
                      self.current = None
                      self.external = False
          parser = ScriptParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('No inline scripts found in index.html')
          for i, source in enumerate(parser.scripts):
              Path(f'/tmp/gyan-inline-{i}.js').write_text(source, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline scripts')
          PY
          for f in /tmp/gyan-inline-*.js; do node --check "$f"; done
      - name: Check Vercel question extraction API syntax
        run: node --check api/extract-questions.js
      - name: Smoke-test API method and authentication guards
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import handler from './api/extract-questions.js';
          process.env.SUPABASE_URL = 'https://example.supabase.co';
          process.env.SUPABASE_PUBLISHABLE_KEY = 'test-publishable-key';
          delete process.env.AI_API_KEY;
          async function invoke(method, headers = {}) {
            const response = {
              statusCode: 200,
              headers: {},
              payload: undefined,
              status(code) { this.statusCode = code; return this; },
              setHeader(key, value) { this.headers[key] = value; },
              send(body) { this.payload = body; return body; }
            };
            await handler({ method, headers, body: {} }, response);
            return response;
          }
          const get = await invoke('GET');
          assert.equal(get.statusCode, 405, 'GET must be rejected');
          const unauthenticated = await invoke('POST');
          assert.equal(unauthenticated.statusCode, 401, 'POST without bearer token must be rejected before AI configuration');
          console.log('API method and authentication guards passed.');
          JS
      - name: Build production assets
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/_headers
          test -s dist/manifest.webmanifest
          test ! -e dist/supabase_schema.sql
          test ! -e dist/supabase_seed.sql
          test ! -e dist/.env.example
          echo "Vercel static output verified. Vercel Functions are deployed from the root api/ directory."
